<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GÜDÜL TİCARET - Stok Takip</title>
    
    <!-- PWA Manifest & App Icons -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0c0c0e" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    
    <!-- iOS / Apple Mobile Web App Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Güdül Stok" />
    <link rel="apple-touch-icon" href="/icon.svg" />
  </head>
  <body class="bg-[#0c0c0e] text-white selection:bg-[#fff]/10">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Dynamic Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              console.log('[Service Worker] Registered successfully:', reg.scope);
            })
            .catch((err) => {
              console.error('[Service Worker] Registration failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
